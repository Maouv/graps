<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>graps</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" type="image/svg+xml" href="/icon/package.svg">
</head>
<body>

<div id="app" class="app">

  <!-- Top bar: panel-header, split icons on right (REF-0008) -->
  <div class="top-bar">
    <button class="icon-btn split-btn" data-panel="dir" aria-pressed="true"
            aria-label="Toggle explorer panel">
      <img src="/icon/split-horizontal-right-select.svg" alt=""
           class="split-img split-mirror" data-state="select">
    </button>
    <button class="icon-btn split-btn" data-panel="ai" aria-pressed="true"
            aria-label="Toggle AI panel">
      <img src="/icon/split-horizontal-right-select.svg" alt=""
           class="split-img" data-state="select">
    </button>
  </div>

  <!-- Panels row (REF-0008) -->
  <div class="panels-row">

    <!-- LEFT: dir-panel — explorer tree (FEAT-0002/0008/0009) -->
    <aside id="dir-panel" class="panel dir-panel" data-open="true">
      <header class="panel-header">
        <h2 class="panel-title">Explorer</h2>
      </header>
      <div class="panel-body tree" id="tree" role="tree" aria-label="Project structure">
        <p class="empty-state">Loading…</p>
      </div>
    </aside>

    <!-- Left resizer (FEAT-0006) -->
    <div class="resizer" id="resizer-left" role="separator"
         aria-orientation="vertical" aria-label="Resize explorer panel" tabindex="0"></div>

    <!-- CENTER: workspace — source/flow/module tabs (FEAT-0003/0010/0011/0012/0013) -->
    <main id="workspace" class="workspace">
      <div class="workspace-toolbar">
        <div class="tab-bar" id="tab-bar" role="tablist" aria-label="Open tabs">
          <span class="tab-empty">No tabs open</span>
        </div>
        <!-- .split-actions removed — buttons moved to .top-bar (REF-0008) -->
      </div>
      <div class="tab-content" id="tab-content">
        <div class="workspace-empty" id="workspace-empty">
          <svg class="empty-icon"><use href="#i-module"/></svg>
          <p>Select a file, function, or module from the explorer.</p>
        </div>
      </div>
    </main>

    <!-- Right resizer (FEAT-0006) -->
    <div class="resizer" id="resizer-right" role="separator"
         aria-orientation="vertical" aria-label="Resize AI panel" tabindex="0"></div>

    <!-- RIGHT: ai-panel — status + input (FEAT-0004/0014/0015) -->
    <aside id="ai-panel" class="panel ai-panel" data-open="true">
      <header class="panel-header">
        <h2 class="panel-title">AI</h2>
      </header>
      <div class="ai-body">
        <div class="ai-messages" id="ai-messages" aria-live="polite" aria-atomic="false"></div>
        <div class="ai-input-bar">
          <input type="text" id="ai-input" placeholder="Ask or /scan…"
                 aria-label="AI input" autocomplete="off" spellcheck="false">
          <button id="ai-send" class="icon-btn" aria-label="Send">
            <svg class="icon"><use href="#i-sync"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- ponytail: backdrop element removed in BUG-0008 — 3-column on all devices -->

  </div><!-- /.panels-row -->

</div>

<script src="/app.js" defer></script>
</body>
</html>
